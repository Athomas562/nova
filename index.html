<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NovaTube</title>
        <link rel="icon" href="favicon.svg" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>
    <body>
        <header class="topbar">
            <a class="logo" href="index.html">
                <img src="logo-icon.svg" alt="NovaTube" />
                <span class="wordmark">Nova<span>Tube</span></span>
            </a>
            <form
                class="searchbar"
                onsubmit="
                    event.preventDefault();
                    location.href =
                        'search.html?q=' + encodeURIComponent(this.q.value);
                "
            >
                <input name="q" placeholder="Rechercher sur NovaTube" />
                <button>Rechercher</button>
            </form>
            <button
                id="loginBtn"
                class="btn"
                onclick="location.href = 'login.html'"
            >
                Connexion
            </button>
            <button
                id="createBtn"
                class="btn btn-primary"
                style="display: none"
                onclick="location.href = 'upload.html'"
            >
                Créer
            </button>
            <button id="logoutBtn" class="btn btn-ghost" style="display: none">
                Déconnexion
            </button>
            <div id="userBox" style="display: none"></div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <a href="index.html" class="active">🏠 <span>Accueil</span></a>
                <a href="subscriptions.html">📺 <span>Abonnements</span></a>
                <hr />
                <a href="library.html">📚 <span>Bibliothèque</span></a>
                <a href="history.html">🕓 <span>Historique</span></a>
                <a href="watch-later.html"
                    >⏱️ <span>À regarder plus tard</span></a
                >
                <a href="playlists.html">🎞️ <span>Playlists</span></a>
                <hr />
                <a href="studio.html">🎬 <span>Studio</span></a>
            </aside>
            <main>
                <div class="categories" id="categories"></div>
                <div id="feed"></div>
            </main>
        </div>

        <script type="module">
            import { initHeader } from "./js/ui.js";
            import { loadHome } from "./js/home.js";
            initHeader();
            loadHome();
        </script>
    </body>
</html>
