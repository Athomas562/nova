<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chaîne — NovaTube</title>
        <link rel="icon" href="favicon.svg" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>
    <body>
        <header class="topbar">
            <a class="logo" href="index.html"
                ><img src="logo-icon.svg" alt="" /><span class="wordmark"
                    >Nova<span>Tube</span></span
                ></a
            >
            <form
                class="searchbar"
                onsubmit="
                    event.preventDefault();
                    location.href =
                        'search.html?q=' + encodeURIComponent(this.q.value);
                "
            >
                <input name="q" placeholder="Rechercher" /><button>OK</button>
            </form>
            <button
                id="loginBtn"
                class="btn"
                onclick="location.href = 'login.html'"
            >
                Connexion
            </button>
            <button
                id="createBtn"
                class="btn btn-primary"
                style="display: none"
                onclick="location.href = 'upload.html'"
            >
                Créer
            </button>
            <button id="logoutBtn" class="btn btn-ghost" style="display: none">
                Déconnexion
            </button>
            <div id="userBox" style="display: none"></div>
        </header>

        <div id="main" class="layout" style="grid-template-columns: 1fr">
            <div>
                <div class="channel-banner" id="channelBanner"></div>
                <div class="channel-header">
                    <img
                        class="avatar-xl"
                        id="channelAvatar"
                        src="logo-icon.svg"
                        alt=""
                    />
                    <div class="info">
                        <h1 id="channelName">—</h1>
                        <div class="username">
                            <span id="channelUsername">@—</span> ·
                            <span id="channelSubs">0 abonné</span>
                        </div>
                        <div class="desc" id="channelDesc"></div>
                    </div>
                    <div class="row">
                        <button
                            class="btn"
                            id="editChannelBtn"
                            style="display: none"
                        >
                            Modifier
                        </button>
                        <button class="btn btn-primary" id="subscribeBtn">
                            S'abonner
                        </button>
                    </div>
                </div>
                <h2 style="margin-top: 24px">Vidéos</h2>
                <div id="channelVideos"></div>
            </div>
        </div>

        <div
            id="editModal"
            class="hidden"
            style="
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 100;
            "
        >
            <div class="form" style="margin: 0; max-width: 520px">
                <button class="close icon-btn" style="float: right">✕</button>
                <h1>Modifier la chaîne</h1>
                <label>Nom affiché</label>
                <input id="editName" type="text" />
                <label>Username</label>
                <input id="editUsername" type="text" />
                <label>Description</label>
                <textarea id="editDesc" rows="3"></textarea>
                <label>Nouvel avatar</label>
                <input id="editAvatar" type="file" accept="image/*" />
                <label>Nouvelle bannière</label>
                <input id="editBanner" type="file" accept="image/*" />
                <button id="editSave" class="btn btn-primary">
                    Enregistrer
                </button>
            </div>
        </div>

        <script type="module">
            import { initHeader } from "./js/ui.js";
            import { initChannel } from "./js/channel.js";
            initHeader();
            initChannel();
        </script>
    </body>
</html>
