<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="NovaTube">
  <defs>
    <linearGradient id="novaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B388FF"/>
      <stop offset="55%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#4A1FB8"/>
    </linearGradient>
    <radialGradient id="novaGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B388FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo doux derrière l'icône -->
  <circle cx="24" cy="24" r="22" fill="url(#novaGlow)"/>

  <!-- Étoile "nova" stylisée : deux triangles croisés formant un losange lumineux -->
  <g transform="translate(6,6)">
    <!-- Triangle supérieur gauche (aile gauche) -->
    <path d="M6 4 L20 4 L14 20 Z" fill="url(#novaGrad)" opacity="0.95"/>
    <!-- Triangle supérieur droit (aile droite) -->
    <path d="M20 4 L34 4 L26 20 Z" fill="url(#novaGrad)" opacity="0.75"/>
    <!-- Pointe basse (le "play" qui descend comme une comète) -->
    <path d="M14 20 L26 20 L20 34 Z" fill="url(#novaGrad)" opacity="0.85"/>
    <!-- Éclat central -->
    <circle cx="20" cy="18" r="2.4" fill="#F2F2F7"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700">
    <text x="60" y="31" font-size="20" fill="#F2F2F7" letter-spacing="-0.4">Nova</text>
    <text x="118" y="31" font-size="20" fill="#B388FF" letter-spacing="-0.4">Tube</text>
  </g>
</svg>